{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Київ{% endblock %} | Мій Київ</title>
    <link rel="stylesheet" href="{% static 'city/style.css' %}">
</head>
<body>
<!-- #3 Навігація між розділами через {% templatetag openblock %} url {% templatetag closeblock %} -->
<header class="header">
    <div class="container header-inner">
        <a class="logo" href="{% url 'city:index' %}">🏛 Мій Київ</a>
        <nav class="nav">
            <a href="{% url 'city:index' %}">Головна</a>
            <a href="{% url 'city:news' %}">Новини</a>
            <a href="{% url 'city:management' %}">Голови міста</a>
            <a href="{% url 'city:facts' %}">Факти</a>
            <a href="{% url 'city:history' %}">Історія</a>
            <a href="{% url 'city:contacts' %}">Контакти</a>
        </nav>
    </div>
</header>

<main class="container main">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="container">© 2026 Мій Київ · Навчальний проєкт на Django</div>
</footer>
</body>
</html>
